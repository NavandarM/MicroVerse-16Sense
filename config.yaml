input_dir: "/path/to/fastqs/"
output_dir: "/path/to/analysis/"
metadata_file: "/path/to/sample_metadata.tsv"
storage_dir: "/path/to/storagespace" # recommend to use it. Specify the location where you would like to store the autodownloaded database and taxonomy. Use it if you don't provide the database_dir and taxonomy.
database_dir: "" ## -optional param
taxonomy_dir: ""  ## -optional param
profile_tool: "singularity" # Nextflow profile for epi2me: "singularity" or "standard" (docker)
nextflow_config: "" ## -optional param. Path to a custom nextflow.config (e.g. executor = 'slurm') so Nextflow can submit its own jobs to the cluster.
